<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>100 Words A Day</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
      <div class="editor-container">
        <textarea class="title" placeholder="What Inspired you today?" rows="1"></textarea>
        <textarea class="body" placeholder="Write 100 words..." rows="5"></textarea>
        <button class="submit-btn">Submit</button>
      </div>
    </div>

    <script>
      // ===== JAVASCRIPT =====
      document.addEventListener('DOMContentLoaded', function() {
        const textareas = document.querySelectorAll('textarea');

        // This function will be called on input
        function onInput() {
          this.style.height = 'auto'; // Reset the height
          this.style.height = (this.scrollHeight) + 'px'; // Set the height to the scroll height
        }

        // Apply the event listener to all textareas
        textareas.forEach(textarea => {
          // Set initial height on page load
          textarea.style.height = (textarea.scrollHeight) + 'px';
          textarea.addEventListener("input", onInput, false);
        });
      });
    </script>
</body>
</html>
